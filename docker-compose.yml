services:
    mysql:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_ROOT_PASSWORD: checkout_password
            MYSQL_DATABASE: checkout_service
        ports:
            - "${MYSQL_HOST_PORT:-3307}:3306"
        volumes:
            - checkout_mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcheckout_password"]
            interval: 3s
            timeout: 3s
            retries: 30

    mysql-test:
        image: mysql:8.0
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_ROOT_PASSWORD: checkout_password
            MYSQL_DATABASE: checkout_service_test
        ports:
            - "${MYSQL_TEST_HOST_PORT:-3308}:3306"
        volumes:
            - checkout_mysql_test_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcheckout_password"]
            interval: 3s
            timeout: 3s
            retries: 30

volumes:
    checkout_mysql_data:
    checkout_mysql_test_data:
